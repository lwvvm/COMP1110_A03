<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketHK - Interactive Budget App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts-d-gstatic-d-com-s-gmn.v.tuangouai.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg-a: #f0f4ff; --bg-b: #f2faf5; --bg-c: #fff8f0; --ink: #1e293b; --accent: #3b82f6; }
    body { font-family: 'Manrope', sans-serif; background: linear-gradient(135deg, var(--bg-a), var(--bg-b), var(--bg-c)); color: var(--ink); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07); }
    .nav-btn.active { background-color: #eff6ff; color: #2563eb; }
    .chip.active { background-color: #dbeafe; border-color: #3b82f6; color: #1e40af; }
    .number-slider { max-width: 100%; overflow-x: auto; white-space: nowrap; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="p-4 pb-28">
  <div class="max-w-5xl mx-auto space-y-6">
    <header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">PocketHK</h1>
        <p class="text-sm text-slate-500">Smart Budgeting · Local First</p>
      </div>
      <input type="month" id="monthPicker" class="rounded-xl border border-slate-200 bg-white/80 px-4 py-2 text-sm font-semibold shadow-sm outline-none focus:ring-2 focus:ring-blue-500 transition-all">
    </header>

    <!-- DASHBOARD -->
    <main id="tab-dashboard" class="tab-panel space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="glass-card rounded-3xl p-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Net Worth</p>
          <div class="number-slider mt-1">
            <h2 id="totalBalance" class="text-3xl font-black text-slate-800 inline-block">$0.00</h2>
          </div>
        </div>
        <div class="glass-card rounded-3xl p-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Monthly Budget</p>
          <div class="flex items-end gap-2 mt-1">
            <h2 id="monthlyBudgetUsage" class="text-3xl font-black text-slate-800">0%</h2>
            <p id="budgetStatusText" class="text-xs text-slate-400 mb-1.5">of limit</p>
          </div>
          <div class="w-full h-2 bg-slate-200 rounded-full mt-3 overflow-hidden">
            <div id="monthProgressBar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
        <div class="glass-card rounded-3xl p-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Net Flow (Month)</p>
          <div class="number-slider mt-1">
            <h2 id="netFlow" class="text-3xl font-black text-slate-800 inline-block">$0.00</h2>
          </div>
        </div>
      </div>

      <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass-card rounded-3xl p-6 space-y-4">
          <h3 class="font-bold text-slate-700">⚡ Quick Add</h3>
          <div id="quickCategoryWrap" class="flex flex-wrap gap-2"></div>
          <div class="flex flex-col sm:flex-row gap-2 bg-slate-50/70 p-2 rounded-2xl border border-slate-100">
            <input type="number" id="quickAmount" placeholder="Amount" class="flex-1 rounded-xl border border-slate-200 p-3 outline-none focus:ring-2 focus:ring-blue-500">
            <select id="quickAccount" class="rounded-xl border border-slate-200 p-3 outline-none"></select>
            <button id="quickAddBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 transition-all">Add</button>
          </div>
          <div class="flex items-center justify-between mt-4">
            <p class="text-xs font-bold text-slate-500 uppercase">Presets</p>
            <button id="togglePresetBtn" class="text-xs font-bold text-blue-500 bg-blue-50 px-3 py-1.5 rounded-lg">Manage</button>
          </div>
          <div id="quickPresetWrap" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
          <form id="presetManageForm" class="hidden bg-slate-50 p-4 rounded-2xl space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="newPresetLabel" placeholder="Label" class="rounded-lg border p-2 text-sm">
              <input type="text" id="newPresetIcon" placeholder="Emoji" class="rounded-lg border p-2 text-sm">
            </div>
            <button type="submit" class="w-full bg-slate-800 text-white py-2 rounded-xl text-sm">Save Preset</button>
          </form>
        </div>

        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold text-slate-700 mb-4">📝 Record Transaction</h3>
          <form id="transactionForm" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <input type="number" id="amountInput" placeholder="Amount" step="0.01" required class="rounded-xl border p-3 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <select id="currencyInput" class="rounded-xl border p-3 text-sm"></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <select id="typeInput" class="rounded-xl border p-3 text-sm">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
              <select id="categoryInput" class="rounded-xl border p-3 text-sm"></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <input type="date" id="dateInput" required class="rounded-xl border p-3 text-sm">
              <select id="accountInput" class="rounded-xl border p-3 text-sm"></select>
            </div>
            <button type="submit" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold">Save</button>
          </form>
        </div>
      </section>

      <section class="glass-card rounded-3xl p-6">
        <input type="text" id="searchInput" placeholder="Search transactions..." class="w-full mb-4 border p-3 rounded-xl text-sm">
        <div id="historyList" class="space-y-3 max-h-96 overflow-y-auto"></div>
      </section>
    </main>

    <!-- INSIGHTS -->
    <main id="tab-insights" class="tab-panel hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold mb-4">Category Breakdown</h3>
          <div class="h-64"><canvas id="pieChart"></canvas></div>
        </div>
        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold mb-4">Expense Trend</h3>
          <div class="h-64"><canvas id="lineChart"></canvas></div>
        </div>
      </div>
    </main>

    <!-- ACCOUNTS -->
    <main id="tab-accounts" class="tab-panel hidden space-y-6">
      <div id="accountCards" class="grid grid-cols-1 sm:grid-cols-3 gap-4"></div>
      <div class="glass-card rounded-3xl p-6">
        <h3 class="font-bold mb-4">🏦 Add New Account</h3>
        <form id="addAccountForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="newAccountName" placeholder="Account Name" required class="border p-3 rounded-xl">
          <select id="newAccountType" class="border p-3 rounded-xl">
            <option value="Cash">Cash</option>
            <option value="Card">Bank/Card</option>
            <option value="E-Wallet">E-Wallet</option>
          </select>
          <button class="md:col-span-2 bg-blue-600 text-white py-3 rounded-xl font-bold">Create</button>
        </form>
      </div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-2 bg-white/95 p-2 rounded-2xl border shadow-2xl z-50">
      <button data-tab="dashboard" class="nav-btn active px-6 py-2.5 rounded-xl font-bold text-sm text-slate-500">Overview</button>
      <button data-tab="insights" class="nav-btn px-6 py-2.5 rounded-xl font-bold text-sm text-slate-500">Insights</button>
      <button data-tab="accounts" class="nav-btn px-6 py-2.5 rounded-xl font-bold text-sm text-slate-500">Accounts</button>
    </nav>
  </div>

  <script>
    const CONFIG = {
      STORAGE_KEY: "pockethk-v10",
      SUPPORTED_CURRENCIES: ["HKD", "USD", "CNY", "JPY", "EUR"],
      FX_TO_HKD: { HKD: 1, USD: 7.82, CNY: 1.08, JPY: 0.052, EUR: 8.45 },
      DEFAULT_EXPENSE_CATS: ["Food", "Transport", "Shopping", "Bills", "Others"],
      DEFAULT_INCOME_CATS: ["Salary", "Investment", "Gift", "Others"]
    };

    const Store = {
      state: null,
      init() {
        const fallback = {
          selectedMonth: new Date().toISOString().slice(0, 7),
          settings: { monthlyBudget: 10000, quickPresets: [] },
          accounts: [{ id: "acc-1", name: "Cash", type: "Cash", currency: "HKD", initialBalance: 0 }],
          transactions: []
        };
        this.state = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY)) || fallback;
      },
      persist() { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.state)); },
      addTransaction(tx) {
        this.state.transactions.push({ id: Math.random().toString(36).substr(2, 9), ...tx });
        this.persist();
      }
    };

    const Utils = {
      toHKD: (amt, cur) => Number(amt) * (CONFIG.FX_TO_HKD[cur] || 1),
      formatMoney: (val, cur = "HKD") => new Intl.NumberFormat('en-HK', { style: 'currency', currency: cur }).format(val)
    };

    const Render = {
      runtime: { selectedQuickCategory: "Food", pieChart: null, lineChart: null },
      all() {
        this.dropdowns();
        this.dashboard();
        this.accounts();
      },
      dropdowns() {
        const curHtml = CONFIG.SUPPORTED_CURRENCIES.map(c => `<option value="${c}">${c}</option>`).join("");
        document.getElementById("currencyInput").innerHTML = curHtml;
        
        const accHtml = Store.state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
        ["accountInput", "quickAccount"].forEach(id => document.getElementById(id).innerHTML = accHtml);
        
        const catHtml = CONFIG.DEFAULT_EXPENSE_CATS.map(c => `<option value="${c}">${c}</option>`).join("");
        document.getElementById("categoryInput").innerHTML = catHtml;
        document.getElementById("monthPicker").value = Store.state.selectedMonth;
      },
      dashboard() {
        const month = Store.state.selectedMonth;
        const search = document.getElementById("searchInput").value.toLowerCase();
        const txs = Store.state.transactions.filter(t => t.date.startsWith(month) && (t.category.toLowerCase().includes(search) || t.note?.toLowerCase().includes(search)));
        
        let income = 0, expense = 0;
        txs.forEach(t => {
          const val = Utils.toHKD(t.amount, t.currency);
          t.type === "income" ? income += val : expense += val;
        });

        document.getElementById("totalBalance").textContent = Utils.formatMoney(income - expense);
        document.getElementById("netFlow").textContent = Utils.formatMoney(income - expense);
        
        const ratio = Math.min(100, Math.round((expense / Store.state.settings.monthlyBudget) * 100));
        document.getElementById("monthlyBudgetUsage").textContent = `${ratio}%`;
        document.getElementById("monthProgressBar").style.width = `${ratio}%`;

        this.history(txs);
        this.quickSection();
      },
      history(txs) {
        const list = document.getElementById("historyList");
        list.innerHTML = txs.sort((a,b) => b.date.localeCompare(a.date)).map(t => `
          <div class="flex justify-between items-center p-4 bg-white/60 rounded-2xl border">
            <div>
              <p class="font-bold text-slate-700">${t.category} <span class="text-xs font-normal text-slate-400">${t.date}</span></p>
              <p class="text-xs text-slate-500">${t.note || ''}</p>
            </div>
            <p class="font-black ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
              ${t.type === 'income' ? '+' : '-'}${Utils.formatMoney(t.amount, t.currency)}
            </p>
          </div>
        `).join("");
      },
      quickSection() {
        const wrap = document.getElementById("quickCategoryWrap");
        wrap.innerHTML = CONFIG.DEFAULT_EXPENSE_CATS.map(c => `
          <button onclick="Render.runtime.selectedQuickCategory='${c}'; Render.quickSection()" class="chip px-4 py-2 rounded-xl border text-xs font-bold ${this.runtime.selectedQuickCategory === c ? 'active' : 'bg-white text-slate-500'}">${c}</button>
        `).join("");
      },
      accounts() {
        const balances = {};
        Store.state.accounts.forEach(a => balances[a.id] = Number(a.initialBalance));
        Store.state.transactions.forEach(t => {
          if (balances[t.accountId] !== undefined) {
            balances[t.accountId] += (t.type === 'income' ? Number(t.amount) : -Number(t.amount));
          }
        });

        document.getElementById("accountCards").innerHTML = Store.state.accounts.map(a => `
          <div class="glass-card p-5 rounded-3xl border-l-4 ${a.type === 'Card' ? 'border-l-rose-400' : 'border-l-blue-400'}">
            <p class="text-xs font-bold text-slate-400 uppercase">${a.type}</p>
            <h4 class="font-bold text-slate-700">${a.name}</h4>
            <p class="text-xl font-black">${Utils.formatMoney(balances[a.id], a.currency)}</p>
          </div>
        `).join("");
      },
      insights() {
        const month = Store.state.selectedMonth;
        const txs = Store.state.transactions.filter(t => t.date.startsWith(month) && t.type === 'expense');
        const dataMap = {};
        txs.forEach(t => dataMap[t.category] = (dataMap[t.category] || 0) + Utils.toHKD(t.amount, t.currency));

        const ctx = document.getElementById("pieChart").getContext("2d");
        if (this.runtime.pieChart) this.runtime.pieChart.destroy();
        this.runtime.pieChart = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: Object.keys(dataMap),
            datasets: [{ data: Object.values(dataMap), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'] }]
          },
          options: { maintainAspectRatio: false }
        });
      }
    };

    // Events
    document.addEventListener("DOMContentLoaded", () => {
      Store.init();
      Render.all();
      
      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
          document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
          document.getElementById(`tab-${btn.dataset.tab}`).classList.remove("hidden");
          btn.classList.add("active");
          if (btn.dataset.tab === 'insights') Render.insights();
          if (btn.dataset.tab === 'accounts') Render.accounts();
        });
      });

      document.getElementById("transactionForm").addEventListener("submit", (e) => {
        e.preventDefault();
        Store.addTransaction({
          amount: document.getElementById("amountInput").value,
          currency: document.getElementById("currencyInput").value,
          type: document.getElementById("typeInput").value,
          category: document.getElementById("categoryInput").value,
          date: document.getElementById("dateInput").value,
          accountId: document.getElementById("accountInput").value
        });
        e.target.reset();
        Render.dashboard();
      });

      document.getElementById("quickAddBtn").addEventListener("click", () => {
        const amt = document.getElementById("quickAmount").value;
        if (!amt) return;
        Store.addTransaction({
          amount: amt, currency: "HKD", type: "expense",
          category: Render.runtime.selectedQuickCategory,
          date: new Date().toISOString().split('T')[0],
          accountId: document.getElementById("quickAccount").value
        });
        document.getElementById("quickAmount").value = "";
        Render.dashboard();
      });

      document.getElementById("monthPicker").addEventListener("change", (e) => {
        Store.state.selectedMonth = e.target.value;
        Store.persist();
        Render.dashboard();
      });

      document.getElementById("searchInput").addEventListener("input", () => Render.dashboard());
    });
  </script>
</body>
</html>
