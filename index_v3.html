<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketHK - Smart Budgeting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --bg-a: #f0f4ff; --bg-b: #f2faf5; --bg-c: #fff8f0; --ink: #1e293b; --accent: #3b82f6; }
    body { font-family: 'Manrope', sans-serif; background: linear-gradient(135deg, var(--bg-a), var(--bg-b), var(--bg-c)); color: var(--ink); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07); }
    .nav-btn.active { background-color: #eff6ff; color: #2563eb; }
    .chip.active { background-color: #dbeafe; border-color: #3b82f6; color: #1e40af; }
    .number-slider { max-width: 100%; overflow-x: auto; white-space: nowrap; padding-bottom: 4px; }
  </style>
</head>
<body class="p-4 pb-28">
  <div class="max-w-5xl mx-auto space-y-6">
    <header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">PocketHK</h1>
        <p class="text-sm text-slate-500">Smart Budgeting · Local Storage</p>
      </div>
      <input type="month" id="monthPicker" class="rounded-xl border border-slate-200 bg-white/80 px-4 py-2 text-sm font-semibold shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
    </header>

    <!-- Dashboard Panel -->
    <main id="tab-dashboard" class="tab-panel space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="glass-card rounded-3xl p-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Total Net Worth (HKD)</p>
          <h2 id="totalBalance" class="text-3xl font-black text-slate-800">$0.00</h2>
        </div>
        <div class="glass-card rounded-3xl p-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Monthly Budget</p>
          <div class="flex items-end gap-2 mt-1">
            <h2 id="monthlyBudgetUsage" class="text-3xl font-black text-slate-800">0%</h2>
            <p class="text-xs text-slate-400 mb-1.5">used</p>
          </div>
          <div class="w-full h-2 bg-slate-200 rounded-full mt-3 overflow-hidden">
            <div id="monthProgressBar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
        <div class="glass-card rounded-3xl p-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Net Flow (This Month)</p>
          <h2 id="netFlow" class="text-3xl font-black text-slate-800">$0.00</h2>
        </div>
      </div>

      <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Quick Add -->
        <div class="glass-card rounded-3xl p-6 space-y-4">
          <h3 class="font-bold text-slate-700">⚡ Quick Add</h3>
          <div id="quickCategoryWrap" class="flex flex-wrap gap-2"></div>
          <div class="flex flex-col sm:flex-row gap-2 bg-slate-50/70 p-2 rounded-2xl">
            <input type="number" id="quickAmount" placeholder="Amount" class="flex-1 rounded-xl border border-slate-200 px-4 py-3 outline-none">
            <select id="quickAccount" class="rounded-xl border border-slate-200 px-3 py-3 outline-none"></select>
            <button id="quickAddBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 active:scale-95 transition-all">Add</button>
          </div>
          <div class="pt-4 border-t border-slate-100">
            <div class="flex justify-between items-center mb-2">
              <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">Presets</p>
              <button id="togglePresetBtn" class="text-xs font-bold text-blue-500">Manage</button>
            </div>
            <div id="quickPresetWrap" class="grid grid-cols-3 gap-2"></div>
            <form id="presetManageForm" class="hidden mt-3 p-4 bg-slate-50 rounded-xl space-y-2">
               <input type="text" id="newPresetLabel" placeholder="Label (e.g. Bus)" required class="w-full p-2 text-sm rounded-lg border">
               <div class="flex gap-2">
                 <input type="text" id="newPresetIcon" placeholder="Icon (e.g. 🚌)" required class="w-1/3 p-2 text-sm rounded-lg border">
                 <input type="number" id="newPresetAmount" placeholder="Amount" required class="w-2/3 p-2 text-sm rounded-lg border">
               </div>
               <select id="newPresetCategory" class="w-full p-2 text-sm rounded-lg border"></select>
               <button type="submit" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm">Save Preset</button>
            </form>
          </div>
        </div>

        <!-- Transaction Form -->
        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold text-slate-700 mb-4">📝 New Transaction</h3>
          <form id="transactionForm" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <input type="number" id="amountInput" placeholder="Amount" step="0.01" required class="rounded-xl border p-3 text-sm">
              <select id="currencyInput" class="rounded-xl border p-3 text-sm"></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <select id="typeInput" class="rounded-xl border p-3 text-sm">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
              </select>
              <select id="categoryInput" class="rounded-xl border p-3 text-sm"></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <input type="date" id="dateInput" required class="rounded-xl border p-3 text-sm">
              <select id="accountInput" class="rounded-xl border p-3 text-sm"></select>
            </div>
            <input type="text" id="noteInput" placeholder="Note (optional)" class="w-full rounded-xl border p-3 text-sm">
            <button type="submit" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold active:scale-95 transition-all">Save Transaction</button>
          </form>
        </div>
      </section>

      <!-- History -->
      <section class="glass-card rounded-3xl p-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
          <h3 class="font-bold text-slate-700">📜 History Details</h3>
          <input type="text" id="searchInput" placeholder="Search note or category..." class="text-sm border px-4 py-2 rounded-xl w-full sm:w-64">
        </div>
        <div id="historyList" class="space-y-3 max-h-96 overflow-y-auto"></div>
      </section>
    </main>

    <!-- Insights Panel -->
    <main id="tab-insights" class="tab-panel hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold text-slate-700 mb-4">Category Breakdown</h3>
          <div class="h-64"><canvas id="pieChart"></canvas></div>
        </div>
        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold text-slate-700 mb-4">Expense Trend</h3>
          <div class="h-64"><canvas id="lineChart"></canvas></div>
        </div>
      </div>
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-2 bg-white/95 backdrop-blur-md p-2 rounded-2xl border shadow-2xl z-50">
      <button data-tab="dashboard" class="nav-btn active px-6 py-2.5 rounded-xl font-bold text-sm">Overview</button>
      <button data-tab="insights" class="nav-btn px-6 py-2.5 rounded-xl font-bold text-sm text-slate-500">Insights</button>
      <button id="exportCsvBtn" class="px-6 py-2.5 rounded-xl font-bold text-sm text-emerald-600">Export</button>
    </nav>
  </div>

  <script>
    const CONFIG = {
      STORAGE_KEY: "pockethk_v2026_en",
      SUPPORTED_CURRENCIES: ["HKD", "USD", "CNY", "EUR", "GBP"],
      FX_TO_HKD: { HKD: 1, USD: 7.8, CNY: 1.1, EUR: 8.5, GBP: 10 },
      DEFAULT_EXPENSE_CATS: ["Dining", "Transport", "Shopping", "Entertainment", "Housing", "Health", "Others"],
      DEFAULT_INCOME_CATS: ["Salary", "Bonus", "Investment", "Part-time"],
      DEFAULT_PRESETS: [{ label: "Bus", icon: "🚌", amount: 10, category: "Transport" }]
    };

    const Utils = {
      uid: () => Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
      formatISO: (date) => date.toISOString().split('T')[0],
      toMonthValue: (date) => date.toISOString().slice(0, 7),
      toHKD: (amt, cur) => Number(amt || 0) * (CONFIG.FX_TO_HKD[cur] || 1),
      formatMoney: (val, cur = 'HKD') => new Intl.NumberFormat('en-HK', { style: 'currency', currency: cur }).format(val)
    };

    const Store = {
      state: null,
      init() {
        const fallback = {
          selectedMonth: Utils.toMonthValue(new Date()),
          settings: { monthlyBudget: 15000, quickPresets: CONFIG.DEFAULT_PRESETS },
          accounts: [{ id: 'a1', name: 'Cash', type: 'Cash', currency: 'HKD', initialBalance: 0 }],
          transactions: []
        };
        const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
        this.state = raw ? JSON.parse(raw) : fallback;
      },
      persist() { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.state)); },
      addTransaction(tx) {
        this.state.transactions.push({ id: Utils.uid(), ...tx });
        this.persist();
      }
    };

    const Logic = {
      getFiltered(month, search = "") {
        return Store.state.transactions.filter(t => 
          t.date.startsWith(month) && 
          (!search || (t.note || "").toLowerCase().includes(search.toLowerCase()) || t.category.toLowerCase().includes(search.toLowerCase()))
        );
      },
      computeBalances() {
        const bals = {};
        Store.state.accounts.forEach(a => bals[a.id] = Number(a.initialBalance));
        Store.state.transactions.forEach(t => {
          if (t.type === 'income') bals[t.accountId] += Number(t.amount);
          else bals[t.accountId] -= Number(t.amount);
        });
        return bals;
      }
    };

    const Render = {
      runtime: { selectedQuickCategory: "Dining", pieChart: null, lineChart: null },
      
      all() {
        this.dropdowns();
        this.dashboard();
      },

      dropdowns() {
        const curHtml = CONFIG.SUPPORTED_CURRENCIES.map(c => `<option value="${c}">${c}</option>`).join("");
        ['currencyInput'].forEach(id => document.getElementById(id).innerHTML = curHtml);

        const expCatHtml = CONFIG.DEFAULT_EXPENSE_CATS.map(cat => `<option value="${cat}">${cat}</option>`).join("");
        document.getElementById('newPresetCategory').innerHTML = expCatHtml;
        document.getElementById('categoryInput').innerHTML = expCatHtml;

        const accHtml = Store.state.accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
        ['accountInput', 'quickAccount'].forEach(id => document.getElementById(id).innerHTML = accHtml);
        
        document.getElementById("monthPicker").value = Store.state.selectedMonth;
      },

      dashboard() {
        const txs = Logic.getFiltered(Store.state.selectedMonth, document.getElementById("searchInput").value);
        let income = 0, expense = 0;
        txs.forEach(t => {
          const val = Utils.toHKD(t.amount, t.currency);
          t.type === 'income' ? income += val : expense += val;
        });

        const bals = Logic.computeBalances();
        let totalHKD = 0;
        Store.state.accounts.forEach(a => totalHKD += Utils.toHKD(bals[a.id], a.currency));

        document.getElementById("totalBalance").textContent = Utils.formatMoney(totalHKD);
        document.getElementById("netFlow").textContent = (income - expense >= 0 ? '+' : '') + Utils.formatMoney(income - expense);
        document.getElementById("netFlow").className = `text-3xl font-black ${(income - expense) >= 0 ? 'text-emerald-500' : 'text-rose-500'}`;
        
        const limit = Store.state.settings.monthlyBudget || 1;
        const ratio = Math.min(100, Math.round((expense / limit) * 100));
        document.getElementById("monthlyBudgetUsage").textContent = `${ratio}%`;
        document.getElementById("monthProgressBar").style.width = `${ratio}%`;
        document.getElementById("monthProgressBar").className = `h-full transition-all duration-500 ${ratio > 90 ? 'bg-rose-500' : 'bg-blue-500'}`;

        this.history(txs);
        this.quickSection();
      },

      history(txs) {
        const list = document.getElementById("historyList");
        if (txs.length === 0) {
          list.innerHTML = `<p class="text-center text-slate-400 py-10">No records found for this period.</p>`;
          return;
        }
        list.innerHTML = txs.sort((a,b) => b.date.localeCompare(a.date)).map(t => `
          <div class="flex justify-between items-center p-4 bg-white/60 rounded-2xl border border-slate-100 hover:shadow-sm transition-all">
            <div>
              <p class="font-bold text-slate-700">${t.category} <span class="text-xs font-normal text-slate-400 ml-2">${t.date}</span></p>
              <p class="text-xs text-slate-500">${t.note || 'No note'}</p>
            </div>
            <div class="text-right">
              <p class="font-black ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                ${t.type === 'income' ? '+' : '-'}${Utils.formatMoney(t.amount, t.currency)}
              </p>
            </div>
          </div>
        `).join("");
      },

      quickSection() {
        document.getElementById("quickCategoryWrap").innerHTML = CONFIG.DEFAULT_EXPENSE_CATS.slice(0, 5).map(c => `
          <button data-action="set-quick-cat" data-cat="${c}" class="chip px-4 py-2 rounded-xl border text-xs font-bold ${this.runtime.selectedQuickCategory === c ? 'active' : 'bg-white text-slate-500'}">${c}</button>
        `).join("");

        document.getElementById("quickPresetWrap").innerHTML = Store.state.settings.quickPresets.map((p, idx) => `
          <button data-action="use-preset" data-idx="${idx}" class="bg-white p-3 rounded-xl border text-left hover:border-blue-300 transition-all active:scale-95 shadow-sm">
            <span class="text-xl">${p.icon}</span>
            <p class="text-[10px] font-bold text-slate-700 truncate">${p.label}</p>
            <p class="text-xs font-semibold text-blue-500">$${p.amount}</p>
          </button>
        `).join("");
      },

      insights() {
        const txs = Logic.getFiltered(Store.state.selectedMonth).filter(t => t.type === 'expense');
        const byCat = {};
        txs.forEach(t => byCat[t.category] = (byCat[t.category] || 0) + Utils.toHKD(t.amount, t.currency));
        
        const labels = Object.keys(byCat);
        const data = Object.values(byCat);

        const ctxPie = document.getElementById("pieChart").getContext("2d");
        if (this.runtime.pieChart) this.runtime.pieChart.destroy();
        this.runtime.pieChart = new Chart(ctxPie, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ["No Data"],
            datasets: [{ data: data.length ? data : [1], backgroundColor: ['#3b82f6', '#fbbf24', '#f87171', '#34d399', '#a78bfa', '#ec4899', '#64748b'] }]
          },
          options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
      }
    };

    const Events = {
      init() {
        document.querySelectorAll(".nav-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const tab = btn.dataset.tab;
            if(!tab) return;
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
            document.querySelectorAll(".nav-btn").forEach(b => {
              b.classList.remove("active");
              b.classList.add("text-slate-500");
            });
            document.getElementById(`tab-${tab}`).classList.remove("hidden");
            btn.classList.add("active");
            btn.classList.remove("text-slate-500");
            if(tab === 'insights') Render.insights();
          });
        });

        document.getElementById("transactionForm").addEventListener("submit", (e) => {
          e.preventDefault();
          Store.addTransaction({
            amount: document.getElementById("amountInput").value,
            currency: document.getElementById("currencyInput").value,
            type: document.getElementById("typeInput").value,
            category: document.getElementById("categoryInput").value,
            date: document.getElementById("dateInput").value,
            note: document.getElementById("noteInput").value,
            accountId: document.getElementById("accountInput").value
          });
          e.target.reset();
          document.getElementById("dateInput").value = Utils.formatISO(new Date());
          Render.dashboard();
        });

        document.getElementById("quickAddBtn").addEventListener("click", () => {
          const amt = document.getElementById("quickAmount").value;
          if (!amt) return;
          Store.addTransaction({
            amount: amt, currency: "HKD", type: "expense",
            category: Render.runtime.selectedQuickCategory,
            date: Utils.formatISO(new Date()),
            accountId: document.getElementById("quickAccount").value
          });
          document.getElementById("quickAmount").value = "";
          Render.dashboard();
        });

        document.getElementById("togglePresetBtn").addEventListener("click", () => {
           const form = document.getElementById("presetManageForm");
           form.classList.toggle("hidden");
           document.getElementById("togglePresetBtn").textContent = form.classList.contains("hidden") ? "Manage" : "Close";
        });

        document.getElementById("presetManageForm").addEventListener("submit", (e) => {
          e.preventDefault();
          Store.state.settings.quickPresets.push({
            label: document.getElementById("newPresetLabel").value,
            icon: document.getElementById("newPresetIcon").value,
            amount: document.getElementById("newPresetAmount").value,
            category: document.getElementById("newPresetCategory").value
          });
          Store.persist();
          e.target.reset();
          document.getElementById("presetManageForm").classList.add("hidden");
          Render.quickSection();
        });

        document.addEventListener("click", (e) => {
          const btn = e.target.closest("button");
          if (!btn) return;
          if (btn.dataset.action === "set-quick-cat") {
            Render.runtime.selectedQuickCategory = btn.dataset.cat;
            Render.quickSection();
          }
          if (btn.dataset.action === "use-preset") {
            const p = Store.state.settings.quickPresets[btn.dataset.idx];
            Store.addTransaction({
              amount: p.amount, currency: "HKD", type: "expense",
              category: p.category, date: Utils.formatISO(new Date()),
              note: p.label, accountId: Store.state.accounts[0].id
            });
            Render.dashboard();
          }
        });

        document.getElementById("monthPicker").addEventListener("change", (e) => {
          Store.state.selectedMonth = e.target.value;
          Store.persist();
          Render.dashboard();
        });
        
        document.getElementById("searchInput").addEventListener("input", () => Render.dashboard());

        document.getElementById("exportCsvBtn").addEventListener("click", () => {
          let csv = "Date,Category,Type,Amount,Currency,Note\n";
          Store.state.transactions.forEach(t => {
            csv += `${t.date},${t.category},${t.type},${t.amount},${t.currency},"${t.note || ''}"\n`;
          });
          const blob = new Blob([csv], { type: 'text/csv' });
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.setAttribute('href', url);
          a.setAttribute('download', `Records_${Store.state.selectedMonth}.csv`);
          a.click();
        });
      }
    };

    document.addEventListener("DOMContentLoaded", () => {
      Store.init();
      Events.init();
      Render.all();
      document.getElementById("dateInput").value = Utils.formatISO(new Date());
    });
  </script>
</body>
</html>
