<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketHK - Interactive Budget App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts-d-gstatic-d-com-s-gmn.v.tuangouai.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Soft Cotton Candy Pastels */
      --bg-a: #ffe4e6; /* Soft Rose */
      --bg-b: #e0e7ff; /* Soft Indigo */
      --bg-c: #fae8ff; /* Soft Fuchsia */
      --ink: #334155;
      --accent: #8b5cf6;
    }
    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, var(--bg-a), var(--bg-b), var(--bg-c));
      background-attachment: fixed;
      color: var(--ink);
      min-height: 100vh;
    }
    
    /* Chunky, Cute Glassmorphism */
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 40px rgba(139, 92, 246, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .glass-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 45px rgba(139, 92, 246, 0.12);
    }
    
    .glass-nav {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.8);
    }
    
    .tab-btn {
      color: #64748b;
      border-radius: 9999px; /* Pill shape */
    }
    .tab-btn.active {
      background-color: #8b5cf6; /* Cute purple accent */
      color: white !important;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }
    
    .chip.active {
      background-color: #ede9fe;
      border-color: #8b5cf6;
      color: #6d28d9;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; border: 2px solid rgba(255,255,255,0.8); }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .insight-title {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      font-weight: 700;
    }

    .insight-divider {
      border-top: 2px dashed #e2e8f0;
    }

    .insight-note {
      background: #f8fafc;
      border: 2px solid #f1f5f9;
      border-radius: 1rem;
      padding: 0.5rem 0.65rem;
    }

    .insight-note strong {
      color: #1e293b;
      font-weight: 700;
    }

    .insight-note-kpi {
      color: #0d9488;
      background: #ccfbf1;
      padding: 0.15rem 0.45rem;
      border-radius: 0.5rem;
      font-weight: 700;
    }

    .budget-insight-item {
      font-size: 0.9rem;
      line-height: 1.5;
      color: #475569;
      background: #ffffff;
      border: 2px solid #f1f5f9;
      border-radius: 1rem;
      padding: 0.6rem 0.8rem;
    }

    .budget-insight-item.alert {
      color: #be123c;
      background: #fff1f2;
      border-color: #ffe4e6;
      font-weight: 600;
    }

    .insight-note-kpi.alert {
      color: #be123c;
      background: #ffe4e6;
    }
    
    /* Playful inputs */
    input, select {
      transition: all 0.2s ease;
    }
  </style>
</head>
<body class="p-4 pb-28">
  <div class="max-w-5xl mx-auto space-y-6">
    <header class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
      <div>
        <h1 class="text-3xl font-bold tracking-tight text-slate-800">PocketHK <span class="text-xl">🌸</span></h1>
        <p class="text-sm text-slate-500 font-medium">Smart Budgeting · Local First</p>
      </div>
      <input type="month" id="monthPicker" class="rounded-full border-2 border-white bg-white/80 px-5 py-2 text-sm font-bold shadow-sm outline-none focus:ring-4 focus:ring-purple-200 focus:border-purple-400 transition-all text-slate-600">
    </header>

    <main id="tab-dashboard" class="tab-panel space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="glass-card rounded-[2rem] p-6 overflow-hidden">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Net Worth</p>
          <div class="overflow-x-auto no-scrollbar pb-1">
             <h2 id="totalBalance" class="text-4xl font-bold text-slate-800 mt-2 whitespace-nowrap">$0.00</h2>
          </div>
        </div>
        <div class="glass-card rounded-[2rem] p-6 overflow-hidden">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Monthly Budget</p>
          <div class="flex items-end gap-2 mt-2">
            <h2 id="monthlyBudgetUsage" class="text-4xl font-bold text-slate-800">0%</h2>
            <p id="budgetStatusText" class="text-xs text-slate-400 mb-2 font-medium">of limit</p>
          </div>
          <div class="w-full h-3 bg-slate-100 rounded-full mt-3 overflow-hidden shadow-inner">
            <div id="monthProgressBar" class="h-full bg-purple-400 transition-all duration-500 rounded-full" style="width: 0%"></div>
          </div>
        </div>
        <div class="glass-card rounded-[2rem] p-6 overflow-hidden">
          <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Net Flow (This Month)</p>
          <div class="overflow-x-auto no-scrollbar pb-1">
             <h2 id="netFlow" class="text-4xl font-bold text-slate-800 mt-2 whitespace-nowrap">$0.00</h2>
          </div>
          <p id="netFlowSub" class="text-xs text-slate-400 mt-1 font-medium">Income vs Expense</p>
        </div>
      </div>

      <section class="grid grid-cols-1 gap-6">
