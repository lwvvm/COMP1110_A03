<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PocketHK - 交互式记账本</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts-d-gstatic-d-com-s-gmn.v.tuangouai.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-a: #f0f4ff;
      --bg-b: #f2faf5;
      --bg-c: #fff8f0;
      --ink: #1e293b;
      --accent: #3b82f6;
    }
    body {
      font-family: 'Manrope', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, var(--bg-a), var(--bg-b), var(--bg-c));
      color: var(--ink);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.07);
    }
    .tab-btn.active {
      background-color: var(--accent);
      color: white;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .chip.active {
      background-color: #dbeafe;
      border-color: #3b82f6;
      color: #1e40af;
    }
  </style>
</head>
<body class="p-4 pb-24">
  <div class="max-w-4xl mx-auto space-y-6">
    <header class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">PocketHK</h1>
        <p class="text-sm text-slate-500">智慧记账 · 本地优先</p>
      </div>
      <input type="month" id="monthPicker" class="rounded-xl border-slate-200 bg-white/80 px-3 py-2 text-sm font-semibold shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
    </header>

    <main id="tab-dashboard" class="tab-panel space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="glass-card rounded-3xl p-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">总资产估值 (HKD)</p>
          <h2 id="totalBalance" class="text-3xl font-black text-slate-800 mt-1">$0.00</h2>
        </div>
        <div class="glass-card rounded-3xl p-6">
          <p class="text-xs font-bold text-slate-500 uppercase tracking-wider">本月支出进度</p>
          <div class="flex items-end gap-2 mt-1">
            <h2 id="monthlyBudgetUsage" class="text-3xl font-black text-slate-800">0%</h2>
            <p id="budgetStatusText" class="text-xs text-slate-400 mb-1.5">of limit</p>
          </div>
          <div class="w-full h-2 bg-slate-100 rounded-full mt-3 overflow-hidden">
            <div id="monthProgressBar" class="h-full bg-blue-500 transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
        <div id="alertArea" class="flex flex-col gap-2">
           </div>
      </div>

      <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass-card rounded-3xl p-6 space-y-4">
          <h3 class="font-bold text-slate-700 flex items-center gap-2">⚡ 快速记账 (HKD)</h3>
          <div id="quickCategoryWrap" class="flex flex-wrap gap-2"></div>
          <div class="flex gap-2">
            <input type="number" id="quickAmount" placeholder="金额" class="flex-1 rounded-xl border-none bg-white px-4 py-3 shadow-inner outline-none focus:ring-2 focus:ring-blue-500">
            <select id="quickAccount" class="rounded-xl border-none bg-white px-3 py-3 shadow-inner outline-none"></select>
            <button id="quickAddBtn" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-blue-700 active:scale-95 transition-all">添加</button>
          </div>
          <div id="quickPresetWrap" class="grid grid-cols-3 gap-2 mt-2"></div>
        </div>

        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold text-slate-700 mb-4">📝 记录交易</h3>
          <form id="transactionForm" class="space-y-3">
            <div class="grid grid-cols-2 gap-3">
              <input type="number" id="amountInput" placeholder="金额" step="0.01" required class="rounded-xl border-slate-200 p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
              <select id="currencyInput" class="rounded-xl border-slate-200 p-2 text-sm"></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <select id="typeInput" class="rounded-xl border-slate-200 p-2 text-sm">
                <option value="expense">支出</option>
                <option value="income">收入</option>
              </select>
              <select id="categoryInput" class="rounded-xl border-slate-200 p-2 text-sm"></select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <input type="date" id="dateInput" class="rounded-xl border-slate-200 p-2 text-sm">
              <select id="accountInput" class="rounded-xl border-slate-200 p-2 text-sm"></select>
            </div>
            <input type="text" id="noteInput" placeholder="备注 (选填)" class="w-full rounded-xl border-slate-200 p-2 text-sm">
            <button type="submit" id="transactionSubmitBtn" class="w-full py-3 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-900">保存交易</button>
          </form>
        </div>
      </section>

      <section class="glass-card rounded-3xl p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-slate-700">📜 交易历史</h3>
          <input type="text" id="searchInput" placeholder="搜索备注或分类..." class="text-xs border-none bg-white/50 px-3 py-2 rounded-lg outline-none focus:ring-1 focus:ring-blue-300">
        </div>
        <div id="historyList" class="space-y-3 max-h-[400px] overflow-y-auto pr-2">
          </div>
      </section>
    </main>

    <main id="tab-insights" class="tab-panel hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold text-slate-700 mb-4">分类占比</h3>
          <div class="h-64"><canvas id="pieChart"></canvas></div>
        </div>
        <div class="glass-card rounded-3xl p-6">
          <h3 class="font-bold text-slate-700 mb-4">收支趋势</h3>
          <div class="h-64"><canvas id="lineChart"></canvas></div>
        </div>
      </div>
      <div class="glass-card rounded-3xl p-6">
        <h3 class="font-bold text-slate-700 mb-4">分类明细</h3>
        <div id="insightCategoryList" class="space-y-2"></div>
      </div>
    </main>

    <main id="tab-budget" class="tab-panel hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card rounded-3xl p-6 space-y-4">
          <h3 class="font-bold text-slate-700">💰 设置总预算</h3>
          <form id="monthlyBudgetForm" class="flex gap-2">
            <input type="number" id="budgetLimitInput" placeholder="每月限额" class="flex-1 rounded-xl border-slate-200 p-2">
            <button class="bg-blue-600 text-white px-4 py-2 rounded-xl font-bold">更新</button>
          </form>
          <div id="categoryBudgetProgressWrap" class="space-y-4 pt-4 border-t"></div>
        </div>
        <div class="glass-card rounded-3xl p-6 space-y-4">
          <h3 class="font-bold text-slate-700">🏷 分类预算管理</h3>
          <form id="categoryBudgetForm" class="space-y-3">
            <select id="categoryBudgetSelect" class="w-full rounded-xl border-slate-200 p-2"></select>
            <input type="number" id="categoryBudgetAmount" placeholder="限额" class="w-full rounded-xl border-slate-200 p-2">
            <button class="w-full bg-slate-800 text-white py-2 rounded-xl font-bold">设定分类预算</button>
          </form>
        </div>
      </div>
    </main>

    <main id="tab-accounts" class="tab-panel hidden space-y-6">
      <div id="accountCards" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="glass-card rounded-3xl p-6 space-y-4">
          <h3 class="font-bold text-slate-700">🏦 新增账户</h3>
          <form id="addAccountForm" class="space-y-3">
            <input type="text" id="newAccountName" placeholder="账户名称 (如: 八达通)" required class="w-full rounded-xl border-slate-200 p-2">
            <select id="newAccountType" class="w-full rounded-xl border-slate-200 p-2">
              <option value="cash">现金</option>
              <option value="card">银行卡/信用卡</option>
              <option value="ewallet">电子钱包</option>
            </select>
            <div class="grid grid-cols-2 gap-2">
              <select id="newAccountCurrency" class="rounded-xl border-slate-200 p-2"></select>
              <input type="number" id="newAccountBalance" placeholder="初始余额" class="rounded-xl border-slate-200 p-2">
            </div>
            <button class="w-full bg-blue-600 text-white py-2 rounded-xl font-bold">创建账户</button>
          </form>
        </div>
        <div class="glass-card rounded-3xl p-6 space-y-4">
          <h3 class="font-bold text-slate-700">🔄 内部转账</h3>
          <form id="transferForm" class="space-y-3">
            <div class="grid grid-cols-2 gap-2">
              <select id="fromAccountInput" class="rounded-xl border-slate-200 p-2 text-xs"></select>
              <select id="toAccountInput" class="rounded-xl border-slate-200 p-2 text-xs"></select>
            </div>
            <input type="number" id="transferAmount" placeholder="金额" class="w-full rounded-xl border-slate-200 p-2">
            <button class="w-full bg-slate-800 text-white py-2 rounded-xl font-bold">确认转账</button>
          </form>
        </div>
      </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-2 bg-white/90 backdrop-blur-md p-2 rounded-2xl shadow-2xl border border-white/50 z-50">
      <button data-tab="dashboard" class="tab-btn active px-5 py-2.5 rounded-xl font-bold text-sm transition-all">概览</button>
      <button data-tab="insights" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 hover:bg-slate-50">洞察</button>
      <button data-tab="budget" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 hover:bg-slate-50">预算</button>
      <button data-tab="accounts" class="tab-btn px-5 py-2.5 rounded-xl font-bold text-sm transition-all text-slate-500 hover:bg-slate-50">账户</button>
      <button id="exportCsvBtn" class="px-5 py-2.5 rounded-xl font-bold text-sm text-emerald-600 hover:bg-emerald-50 transition-all">导出</button>
    </nav>
  </div>

  <script>
    const CONFIG = {
      STORAGE_KEY: "pockethk-v2",
      SUPPORTED_CURRENCIES: ["HKD", "USD", "CNY", "JPY", "EUR", "GBP"],
      FX_TO_HKD: { HKD: 1, USD: 7.82, CNY: 1.08, JPY: 0.052, EUR: 8.45, GBP: 9.92 },
      DEFAULT_EXPENSE_CATS: ["餐饮", "交通", "购物", "娱乐", "账单", "租金", "医疗", "其他"],
      DEFAULT_INCOME_CATS: ["工资", "奖金", "理财", "赠予", "其他"],
      DEFAULT_QUICK_PRESETS: [
        { label: "MTR", amount: 15, category: "交通", icon: "🚇" },
        { label: "午餐", amount: 65, category: "餐饮", icon: "🍱" },
        { label: "咖啡", amount: 28, category: "餐饮", icon: "☕" }
      ]
    };

    const Store = {
      state: null,
      init() {
        const fallback = {
          selectedMonth: Utils.toMonthValue(new Date()),
          settings: { monthlyBudget: 15000, categoryBudgets: {}, quickPresets: [...CONFIG.DEFAULT_QUICK_PRESETS] },
          customExpenseCategories: [],
          customIncomeCategories: [],
          accounts: [
            { id: "acc-cash", name: "现金", type: "cash", currency: "HKD", initialBalance: 1000 },
            { id: "acc-card", name: "信用卡", type: "card", currency: "HKD", initialBalance: 0 }
          ],
          transactions: []
        };
        const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
        this.state = raw ? JSON.parse(raw) : fallback;
        if (!this.state.selectedMonth) this.state.selectedMonth = fallback.selectedMonth;
      },
      persist() {
        localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(this.state));
      },
      addTransaction(tx) {
        this.state.transactions.push({ id: Utils.uid(), ...tx });
        this.persist();
      },
      deleteTransaction(id) {
        this.state.transactions = this.state.transactions.filter(t => t.id !== id);
        this.persist();
      }
    };
    const Logic = {
      getFilteredTransactions(month, search = "") {
        return Store.state.transactions
          .filter(t => t.date.startsWith(month))
          .filter(t => !search || (t.note || "").toLowerCase().includes(search.toLowerCase()) || t.category.toLowerCase().includes(search.toLowerCase()));
      },
      computeSummary(txs) {
        let income = 0, expense = 0;
        const byCat = {};
        txs.forEach(t => {
          const val = Utils.toHKD(t.amount, t.currency);
          if (t.type === "expense") {
            expense += val;
            byCat[t.category] = (byCat[t.category] || 0) + val;
          } else if (t.type === "income") {
            income += val;
          }
        });
        return { income, expense, byCat };
      },
      computeAccountBalances() {
        const balances = {};
        Store.state.accounts.forEach(a => balances[a.id] = Number(a.initialBalance || 0));
        Store.state.transactions.forEach(t => {
          if (balances[t.accountId] === undefined) return;
          if (t.type === "income") balances[t.accountId] += Number(t.amount);
          if (t.type === "expense") balances[t.accountId] -= Number(t.amount);
        });
        return balances;
      }
    };

    // ==========================================
    // 3. 视图渲染 (Render)
    // ==========================================
    const Render = {
      runtime: { selectedQuickCategory: "餐饮", pieChart: null, lineChart: null },
      
      all() {
        this.dropdowns();
        this.dashboard();
        this.accounts();
        this.budget();
      },

      dropdowns() {
        const curOpts = CONFIG.SUPPORTED_CURRENCIES.map(c => `<option value="${c}">${c}</option>`).join("");
        ["currencyInput", "newAccountCurrency", "quickCurrency"].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.innerHTML = curOpts;
        });

        const accOpts = Store.state.accounts.map(a => `<option value="${a.id}">${a.name} (${a.currency})</option>`).join("");
        ["accountInput", "quickAccount", "fromAccountInput", "toAccountInput"].forEach(id => {
          document.getElementById(id).innerHTML = accOpts;
        });

        const catOpts = CONFIG.DEFAULT_EXPENSE_CATS.map(c => `<option value="${c}">${c}</option>`).join("");
        document.getElementById("categoryInput").innerHTML = catOpts;
        document.getElementById("categoryBudgetSelect").innerHTML = catOpts;
        
        document.getElementById("monthPicker").value = Store.state.selectedMonth;
      },

      dashboard() {
        const txs = Logic.getFilteredTransactions(Store.state.selectedMonth, document.getElementById("searchInput").value);
        const { income, expense } = Logic.computeSummary(txs);
        const balances = Logic.computeAccountBalances();
        
        // 总资产 (换算为 HKD)
        let totalHKD = 0;
        Store.state.accounts.forEach(a => {
           totalHKD += Utils.toHKD(balances[a.id], a.currency);
        });
        document.getElementById("totalBalance").textContent = Utils.formatMoney(totalHKD, "HKD");

        // 预算进度
        const limit = Store.state.settings.monthlyBudget || 1;
        const ratio = Math.round((expense / limit) * 100);
        document.getElementById("monthlyBudgetUsage").textContent = `${ratio}%`;
        document.getElementById("monthProgressBar").style.width = `${Math.min(100, ratio)}%`;

        this.history(txs);
        this.quickSection();
      },

      history(txs) {
        const list = document.getElementById("historyList");
        if (txs.length === 0) {
          list.innerHTML = `<p class="text-center text-slate-400 py-8 text-sm">暂无本月交易记录</p>`;
          return;
        }
        list.innerHTML = txs.sort((a,b) => b.date.localeCompare(a.date)).map(t => `
          <div class="flex justify-between items-center p-3 bg-white/50 rounded-2xl border border-slate-100">
            <div>
              <p class="font-bold text-slate-700">${t.category} <span class="text-xs font-normal text-slate-400 ml-2">${t.date}</span></p>
              <p class="text-xs text-slate-500">${t.note || ''}</p>
            </div>
            <div class="text-right">
              <p class="font-black ${t.type === 'income' ? 'text-emerald-500' : 'text-rose-500'}">
                ${t.type === 'income' ? '+' : '-'}${Utils.formatMoney(t.amount, t.currency)}
              </p>
              <button data-action="delete-tx" data-id="${t.id}" class="text-[10px] text-slate-300 hover:text-rose-400">删除</button>
            </div>
          </div>
        `).join("");
      },

      quickSection() {
        const catWrap = document.getElementById("quickCategoryWrap");
        catWrap.innerHTML = CONFIG.DEFAULT_EXPENSE_CATS.slice(0, 5).map(c => `
          <button data-action="set-quick-cat" data-cat="${c}" class="chip px-3 py-1.5 rounded-full border border-slate-200 text-xs font-bold transition-all ${this.runtime.selectedQuickCategory === c ? 'active' : 'bg-white text-slate-500'}">${c}</button>
        `).join("");

        const preWrap = document.getElementById("quickPresetWrap");
        preWrap.innerHTML = Store.state.settings.quickPresets.map(p => `
          <button data-action="use-preset" data-label="${p.label}" data-amt="${p.amount}" data-cat="${p.category}" class="bg-white p-2 rounded-xl border border-slate-100 text-left hover:shadow-md transition-all">
            <span class="text-lg">${p.icon}</span>
            <p class="text-[10px] font-bold text-slate-700 truncate">${p.label}</p>
            <p class="text-[10px] text-blue-500">$${p.amount}</p>
          </button>
        `).join("");
      },

      insights() {
        const txs = Logic.getFilteredTransactions(Store.state.selectedMonth);
        const { byCat, expense } = Logic.computeSummary(txs);
        const ctxPie = document.getElementById("pieChart").getContext("2d");
        if (this.runtime.pieChart) this.runtime.pieChart.destroy();
        this.runtime.pieChart = new Chart(ctxPie, {
          type: 'doughnut',
          data: {
            labels: Object.keys(byCat),
            datasets: [{ data: Object.values(byCat), backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'], borderWeight: 0 }]
          },
          options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
        const daily = {};
        txs.filter(t => t.type === 'expense').forEach(t => { daily[t.date] = (daily[t.date] || 0) + Utils.toHKD(t.amount, t.currency); });
        const sortedDates = Object.keys(daily).sort();
        
        const ctxLine = document.getElementById("lineChart").getContext("2d");
        if (this.runtime.lineChart) this.runtime.lineChart.destroy();
        this.runtime.lineChart = new Chart(ctxLine, {
          type: 'line',
          data: {
            labels: sortedDates.map(d => d.split('-')[2]),
            datasets: [{ label: '日支出', data: sortedDates.map(d => daily[d]), borderColor: '#3b82f6', tension: 0.4, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)' }]
          },
          options: { maintainAspectRatio: false }
        });
        document.getElementById("insightCategoryList").innerHTML = Object.entries(byCat).sort((a,b) => b[1] - a[1]).map(([cat, val]) => `
          <div class="flex justify-between text-sm p-2 border-b border-slate-50">
            <span class="text-slate-600">${cat}</span>
            <span class="font-bold">${Utils.formatMoney(val, "HKD")} (${((val/expense)*100).toFixed(1)}%)</span>
          </div>
        `).join("");
      },

      budget() {
        const { byCat } = Logic.computeSummary(Logic.getFilteredTransactions(Store.state.selectedMonth));
        const wrap = document.getElementById("categoryBudgetProgressWrap");
        const b = Store.state.settings.categoryBudgets;
        
        wrap.innerHTML = Object.entries(b).map(([cat, limit]) => {
          const spent = byCat[cat] || 0;
          const ratio = Math.min(100, (spent / limit) * 100);
          return `
            <div>
              <div class="flex justify-between text-xs mb-1">
                <span class="font-bold text-slate-700">${cat}</span>
                <span class="text-slate-400">${spent.toFixed(0)} / ${limit}</span>
              </div>
              <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-emerald-500" style="width: ${ratio}%"></div>
              </div>
            </div>
          `;
        }).join("");
      },

      accounts() {
        const bals = Logic.computeAccountBalances();
        document.getElementById("accountCards").innerHTML = Store.state.accounts.map(a => `
          <div class="glass-card p-4 rounded-2xl border-l-4 ${a.type === 'card' ? 'border-l-rose-400' : 'border-l-blue-400'}">
            <p class="text-[10px] font-bold text-slate-400 uppercase">${a.type}</p>
            <h4 class="font-bold text-slate-700">${a.name}</h4>
            <p class="text-xl font-black text-slate-800 mt-1">${Utils.formatMoney(bals[a.id], a.currency)}</p>
          </div>
        `).join("");
      }
    };
    const Events = {
      init() {
        document.querySelectorAll(".tab-btn[data-tab]").forEach(btn => {
          btn.addEventListener("click", (e) => {
            const tab = btn.dataset.tab;
            document.querySelectorAll(".tab-panel").forEach(p => p.classList.add("hidden"));
            document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active", "text-slate-500"));
            document.getElementById(`tab-${tab}`).classList.remove("hidden");
            btn.classList.add("active");
            if (tab === 'insights') Render.insights();
            if (tab === 'budget') Render.budget();
            if (tab === 'accounts') Render.accounts();
          });
        });

        // 记账表单
        document.getElementById("transactionForm").addEventListener("submit", (e) => {
          e.preventDefault();
          Store.addTransaction({
            amount: document.getElementById("amountInput").value,
            currency: document.getElementById("currencyInput").value,
            type: document.getElementById("typeInput").value,
            category: document.getElementById("categoryInput").value,
            date: document.getElementById("dateInput").value || Utils.formatISO(new Date()),
            note: document.getElementById("noteInput").value,
            accountId: document.getElementById("accountInput").value
          });
          e.target.reset();
          Render.dashboard();
        });

        // 快速记账
        document.getElementById("quickAddBtn").addEventListener("click", () => {
          const amt = document.getElementById("quickAmount").value;
          if (!amt) return;
          Store.addTransaction({
            amount: amt, currency: "HKD", type: "expense",
            category: Render.runtime.selectedQuickCategory,
            date: Utils.formatISO(new Date()),
            accountId: document.getElementById("quickAccount").value
          });
          document.getElementById("quickAmount").value = "";
          Render.dashboard();
        });
        document.getElementById("transferForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const amt = document.getElementById("transferAmount").value;
          const from = document.getElementById("fromAccountInput").value;
          const to = document.getElementById("toAccountInput").value;
          if (from === to || !amt) return;
          
          const date = Utils.formatISO(new Date());
          Store.addTransaction({ amount: amt, currency: "HKD", type: "expense", category: "转账", note: `转出至 ${to}`, accountId: from, date });
          Store.addTransaction({ amount: amt, currency: "HKD", type: "income", category: "转账", note: `从 ${from} 转入`, accountId: to, date });
          
          e.target.reset();
          Render.accounts();
          Render.dashboard();
        });
        document.getElementById("monthlyBudgetForm").addEventListener("submit", (e) => {
          e.preventDefault();
          Store.state.settings.monthlyBudget = Number(document.getElementById("budgetLimitInput").value);
          Store.persist();
          Render.dashboard();
        });

        document.getElementById("categoryBudgetForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const cat = document.getElementById("categoryBudgetSelect").value;
          const amt = Number(document.getElementById("categoryBudgetAmount").value);
          Store.state.settings.categoryBudgets[cat] = amt;
          Store.persist();
          Render.budget();
        });
        document.getElementById("addAccountForm").addEventListener("submit", (e) => {
          e.preventDefault();
          Store.state.accounts.push({
            id: Utils.uid(),
            name: document.getElementById("newAccountName").value,
            type: document.getElementById("newAccountType").value,
            currency: document.getElementById("newAccountCurrency").value,
            initialBalance: Number(document.getElementById("newAccountBalance").value || 0)
          });
          Store.persist();
          e.target.reset();
          Render.dropdowns();
          Render.accounts();
        });
        document.addEventListener("click", (e) => {
          const btn = e.target.closest("button[data-action]");
          if (!btn) return;
          const act = btn.dataset.action;
          if (act === "delete-tx") {
            if (confirm("确定删除这条记录吗？")) {
              Store.deleteTransaction(btn.dataset.id);
              Render.dashboard();
            }
          } else if (act === "set-quick-cat") {
            Render.runtime.selectedQuickCategory = btn.dataset.cat;
            Render.quickSection();
          } else if (act === "use-preset") {
            Store.addTransaction({
              amount: btn.dataset.amt, currency: "HKD", type: "expense",
              category: btn.dataset.cat, date: Utils.formatISO(new Date()),
              note: btn.dataset.label, accountId: document.getElementById("quickAccount").value
            });
            Render.dashboard();
          }
        });

        // 搜索与月份切换
        document.getElementById("searchInput").addEventListener("input", () => Render.dashboard());
        document.getElementById("monthPicker").addEventListener("change", (e) => {
          Store.state.selectedMonth = e.target.value;
          Store.persist();
          Render.dashboard();
        });

        // 导出 CSV
        document.getElementById("exportCsvBtn").addEventListener("click", () => {
          const csv = ["Date,Category,Type,Amount,Currency,Note"];
          Store.state.transactions.forEach(t => {
            csv.push(`${t.date},${t.category},${t.type},${t.amount},${t.currency},"${t.note || ''}"`);
          });
          const blob = new Blob([csv.join("\n")], { type: "text/csv" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `PocketHK_Backup_${Store.state.selectedMonth}.csv`;
          a.click();
        });
      }
    };
    const Utils = {
      uid: () => Date.now().toString(36) + Math.random().toString(36).substr(2),
      formatISO: (date) => date.toISOString().split('T')[0],
      toMonthValue: (date) => date.toISOString().slice(0, 7),
      toHKD: (amt, cur) => Number(amt || 0) * (CONFIG.FX_TO_HKD[cur] || 1),
      formatMoney: (val, cur) => new Intl.NumberFormat('en-HK', { style: 'currency', currency: cur || 'HKD' }).format(val)
    };
    document.addEventListener("DOMContentLoaded", () => {
      Store.init();
      Events.init();
      Render.all();
      document.getElementById("dateInput").value = Utils.formatISO(new Date());
    });
  </script>
</body>
</html>
